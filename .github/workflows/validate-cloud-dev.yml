name: Stock Bot research regression tests

on:
  push:
    branches: [cloud-dev, 'ui-ux/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen research code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy plotly
      - name: Execute all stock bot unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
